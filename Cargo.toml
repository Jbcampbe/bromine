[workspace]
resolver = "3"
members = ["crates/bromine", "crates/bromine-core", "crates/bromine-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
bromine-core = { path = "crates/bromine-core" }
bromine-ui = { path = "crates/bromine-ui" }

anyhow = "1"
csv = "1.4"
futures = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
thiserror = "2"
unicode-segmentation = "1"

# GPUI's default HTTP client refuses every request, so the app supplies this
# one for remote images. The package is a fork of reqwest already in the
# dependency graph through GPUI, and the features match what GPUI asks for.
reqwest = { version = "0.12.15-zed", package = "zed-reqwest", default-features = false, features = ["blocking", "charset", "http2", "macos-system-configuration", "multipart", "rustls-tls-native-roots", "socks", "stream"] }

# `preserve_order` is a correctness requirement, not a nicety: a JSON viewer
# that silently re-sorts keys alphabetically shows the user a document that is
# not the one on disk, and formatting would destroy the original order.
serde_json = { version = "1", features = ["preserve_order"] }

# The binary decodes the `file://` URLs macOS sends when a document is opened.
# The crate is already in the dependency graph through GPUI, so this adds no
# new code to the build.
url = "2"

# GPUI is pre-1.0 and the API moves between releases, so the version is pinned
# exactly. `runtime_shaders` compiles GPUI's Metal shaders at startup instead of
# build time, which removes the build dependency on Xcode's `metal`/`metallib`
# (Xcode Command Line Tools alone are enough). See AGENTS.md.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }

# GPUI spends most of its time in its own dependency tree, and an unoptimized
# render loop is unusable in a GUI app. Build dependencies optimized, keep our
# own crates debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
